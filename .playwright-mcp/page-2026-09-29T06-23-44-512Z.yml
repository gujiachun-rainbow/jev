        - heading "2.1 Choice：类别要能区分，也要能兜底" [level=3] [ref=e161]
        - paragraph [ref=e162]:
          - text: Choice 的
          - code [ref=e163]: criteria
          - text: 是选项与描述的映射。选项不具有高低顺序；你不能因为售后排在物流后面，就认为它“更严重”。对当前主诉求进行单选时，要在描述里写清如何处理重叠、未知或多意图输入。
        - generic [ref=e164]:
          - generic [ref=e165]:
            - generic [ref=e166]: Python · 结果读取示意，接续上面的 result
            - button "复制代码" [ref=e167] [cursor=pointer]
          - code [ref=e169]: "answer = result.choices[\"team\"] category = answer.choice # 选中的类别 distribution = answer.probabilities # 所有类别的概率 certainty = answer.confidence # 分布集中程度的摘要 if category == \"other\" or certainty < 0.5: action = \"先澄清\" else: action = \"进入对应处理流程\""
        - paragraph [ref=e170]:
          - code [ref=e171]: choice
          - text: 是概率最高的选项，
          - code [ref=e172]: probabilities
          - text: 给出完整分布，
          - code [ref=e173]: confidence
          - text: 概括分布的集中程度。它不等于最大类别概率，也不是通过真实标签测得的正确率。即使模型十分确信选项为
          - code [ref=e174]: other
          - text: ，业务仍应走范围外处理。
          - link "Choice 定义 ↗" [ref=e175] [cursor=pointer]:
            - /url: https://docs.typesafe.ai/primitives/choice
        - heading "2.2 Score：先定义等级，再解释分数" [level=3] [ref=e176]
        - paragraph [ref=e177]:
          - text: 给缺陷严重程度定义三个等级：0 = 不影响业务；1 = 部分功能受阻但有替代操作；2 = 核心业务阻塞。分数可以位于等级之间。假设等级概率为
          - code [ref=e178]: "{0: 0.0, 1: 0.6, 2: 0.4}"
          - text: ，得到的是：
        - generic [ref=e179]: score = 0 × 0.0 + 1 × 0.6 + 2 × 0.4 = 1.4
        - paragraph [ref=e180]:
          - text: 这里的 1.4 是所定义尺度上的加权位置。它不是“有 70% 的概率严重”，也不是百分制成绩。不同标准下的分数不应直接比较。项目里的
          - code [ref=e181]: case_score.py
          - text: 分开评估严重程度与报告质量，因为报告写得完整并不代表问题更严重。
        - generic [ref=e182]:
          - generic [ref=e183]:
            - generic [ref=e184]: Python · Score 结果读取
            - button "复制代码" [ref=e185] [cursor=pointer]
          - code [ref=e187]: "answer = result.scores[\"severity\"] expected = sum( level * probability for level, probability in answer.probabilities.items() ) print(answer.score, expected) # SDK 的等级键为整数；原始 JSON 中的等级键是字符串。"
        - paragraph [ref=e188]:
          - text: 原语定义与等级索引见
          - link "Score 文档" [ref=e189] [cursor=pointer]:
            - /url: https://docs.typesafe.ai/primitives/score
          - text: 。
        - heading "2.3 Noul：概率还要经过业务策略" [level=3] [ref=e190]
        - paragraph [ref=e191]: Noul 判断“某个条件是否成立”，返回 0～1。接近 1 表示强烈支持“是”，接近 0 表示支持“否”，接近 0.5 表示判断不确定。它没有独立的 confidence 字段。低概率表示不支持当前命题，不等于一次请求失败。
        - generic [ref=e192]:
          - generic [ref=e193]:
            - generic [ref=e194]: Python · 三段式策略示意；阈值需验证
            - button "复制代码" [ref=e195] [cursor=pointer]
          - code [ref=e197]: "p = result.nouls[\"human\"].noul if p >= 0.8: action = \"登记人工诉求\" elif p <= 0.2: action = \"未检测到明确人工诉求\" else: action = \"进一步确认\" # 不要写 if p: —— bool(0.01) 也会得到 True。"
        - paragraph [ref=e198]:
          - text: “是否表达紧迫性”是一个条件问题；“有多愤怒”是程度问题。若你想测量程度，应该定义有序 Score 标准。概率和程度解决的是不同问题。
