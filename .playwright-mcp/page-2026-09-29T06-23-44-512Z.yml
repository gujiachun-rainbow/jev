            - button "复制代码" [ref=e126] [cursor=pointer]
          - code [ref=e128]: "from typesafe_sdk import Choice, Noul, Score from runtime import create_client with create_client() as client: result = client.system_one( state=\"支付接口持续报错，客户都无法付款，请尽快协助。\", questions={ \"team\": Choice( instructions=\"应该由哪个团队处理根本问题？\", criteria={\"engineering\": \"系统或接口故障\", \"billing\": \"扣款或账单争议\", \"other\": \"其他\"}), \"severity\": Score( instructions=\"故障影响程度如何？\", criteria=[\"不影响业务\", \"部分受影响但有替代方案\", \"核心业务全部阻塞\"]), \"human\": Noul(instructions=\"是否明确要求人工协助？\"), }, ) print(result.choices[\"team\"].choice) print(result.scores[\"severity\"].score) print(result.nouls[\"human\"].noul)"
        - paragraph [ref=e129]:
          - code [ref=e130]: questions
          - text: 的键用于把请求和结果对应起来。例如
          - code [ref=e131]: team
          - text: 的答案在
          - code [ref=e132]: result.choices["team"]
          - text: 。键名本身不承担问题说明；实际判定内容写在
          - code [ref=e133]: instructions
          - text: 和
          - code [ref=e134]: criteria
          - text: 中。你也可以运行
          - code [ref=e135]: .venv/bin/python main.py --json
          - text: 查看模型、答案和用量等原始返回字段。
