            - button "复制代码" [ref=e211] [cursor=pointer]
          - code [ref=e213]: "answer = result.choices[\"team\"] category = answer.choice # 选中的类别 distribution = answer.probabilities # 所有类别的概率 certainty = answer.confidence # 分布集中程度的摘要 if category == \"other\" or certainty < 0.5: action = \"先澄清\" else: action = \"进入对应处理流程\""
        - paragraph [ref=e214]:
          - code [ref=e215]: choice
          - text: 是概率最高的选项，
          - code [ref=e216]: probabilities
          - text: 给出完整分布，
          - code [ref=e217]: confidence
          - text: 概括分布的集中程度。它不等于最大类别概率，也不是通过真实标签测得的正确率。即使模型十分确信选项为
          - code [ref=e218]: other
          - text: ，业务仍应走范围外处理。
          - link "Choice 定义 ↗" [ref=e219] [cursor=pointer]:
