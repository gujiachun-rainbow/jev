            - button "复制代码" [ref=e170] [cursor=pointer]
          - code [ref=e172]: "from typesafe_sdk import Choice, Noul, Score from runtime import create_client with create_client() as client: result = client.system_one( state=\"支付接口持续报错，客户都无法付款，请尽快协助。\", questions={ \"team\": Choice( instructions=\"应该由哪个团队处理根本问题？\", criteria={\"engineering\": \"系统或接口故障\", \"billing\": \"扣款或账单争议\", \"other\": \"其他\"}), \"severity\": Score( instructions=\"故障影响程度如何？\", criteria=[\"不影响业务\", \"部分受影响但有替代方案\", \"核心业务全部阻塞\"]), \"human\": Noul(instructions=\"是否明确要求人工协助？\"), }, ) print(result.choices[\"team\"].choice) print(result.scores[\"severity\"].score) print(result.nouls[\"human\"].noul)"
        - paragraph [ref=e173]:
