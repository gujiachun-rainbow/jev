        - heading "2.1 Choice：类别要能区分，也要能兜底" [level=3] [ref=e205]
        - paragraph [ref=e206]:
          - text: Choice 的
          - code [ref=e207]: criteria
          - text: 是选项与描述的映射。选项不具有高低顺序；你不能因为售后排在物流后面，就认为它“更严重”。对当前主诉求进行单选时，要在描述里写清如何处理重叠、未知或多意图输入。
        - generic [ref=e208]:
