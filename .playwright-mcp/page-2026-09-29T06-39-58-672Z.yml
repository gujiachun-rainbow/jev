        - heading "2.2 Score：先定义等级，再解释分数" [level=3] [ref=e220]
        - paragraph [ref=e221]:
          - text: 给缺陷严重程度定义三个等级：0 = 不影响业务；1 = 部分功能受阻但有替代操作；2 = 核心业务阻塞。分数可以位于等级之间。假设等级概率为
          - code [ref=e222]: "{0: 0.0, 1: 0.6, 2: 0.4}"
          - text: ，得到的是：
        - generic [ref=e223]: score = 0 × 0.0 + 1 × 0.6 + 2 × 0.4 = 1.4
        - paragraph [ref=e224]:
          - text: 这里的 1.4 是所定义尺度上的加权位置。它不是“有 70% 的概率严重”，也不是百分制成绩。不同标准下的分数不应直接比较。项目里的
          - code [ref=e225]: case_score.py
          - text: 分开评估严重程度与报告质量，因为报告写得完整并不代表问题更严重。
        - generic [ref=e226]:
          - generic [ref=e227]:
            - generic [ref=e228]: Python · Score 结果读取
            - button "复制代码" [ref=e229] [cursor=pointer]
          - code [ref=e231]: "answer = result.scores[\"severity\"] expected = sum( level * probability for level, probability in answer.probabilities.items() ) print(answer.score, expected) # SDK 的等级键为整数；原始 JSON 中的等级键是字符串。"
