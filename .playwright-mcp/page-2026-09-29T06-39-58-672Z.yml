        - heading "序章 为什么有 Jev" [level=1] [ref=e43]
        - generic [ref=e44]: 理解语义判断的常见做法、接入难点，以及 Jev 带来的变化。
        - paragraph [ref=e45]: 客户说“订单还没收到”，系统要决定交给物流还是售后；用户说“经常出差”，推荐系统要判断哪件商品更合适。这些任务需要理解语言，但程序最终需要的是类别、分数或条件是否成立。Jev 正是围绕这类需求设计的：把语义判断作为专门的模型能力，直接提供给软件使用。
        - heading "一、没有 Jev 时，这类问题怎么解决？" [level=3] [ref=e46]
        - paragraph [ref=e47]: 语义判断早已有多种实现方式。选择哪一种，取决于任务范围、数据和维护成本。
        - generic [ref=e48]:
          - generic [ref=e49]:
            - text: 01 / 规则与关键词
            - heading "把判断写成条件" [level=4] [ref=e50]
            - paragraph [ref=e51]: 例如看到“物流”就分到物流队列。规则明确、容易追踪，但“怎么还没送到”和“已经收到了，不用查物流”需要理解不同含义；只靠关键词时，往往要不断补充例外。
          - generic [ref=e52]:
            - text: 02 / 专用分类模型
            - heading "为特定任务训练模型" [level=4] [ref=e53]
            - paragraph [ref=e54]: 用标注样本训练分类器或评分模型，可以直接输出判断。代价是准备数据、训练与维护；新增类别或改变标准时，还要评估是否需要重新训练。
          - generic [ref=e55]:
            - text: 03 / 通用大模型
            - heading "在提示词里定义判断任务" [level=4] [ref=e56]
            - paragraph [ref=e57]: 描述类别或评分规则，要求返回文本或 JSON，再把结果接入程序。这种方式灵活，也可以使用结构化输出；开发者仍需设计字段、明确分数含义，并处理不确定的结果。
        - heading "二、接入难点：拿到答案后，程序凭什么继续？" [level=3] [ref=e58]
        - generic [ref=e59]: “这大概是物流问题，建议查询订单。”
        - paragraph [ref=e60]: 人能理解这句话，但程序还需要明确的约定：类别字段是什么？“大概”怎么影响分流？信息不足时，是直接查询还是先追问？即使返回合法 JSON，也只解决了结果格式的一部分问题，不能证明语义判断正确，更不能自动确定业务动作。
        - paragraph [ref=e61]: 分类、评分和条件检查会在不同业务里反复出现。与其每次重新约定一套回答方式，可以把它们设计成统一的判断接口：明确问什么、返回什么，再由代码决定如何使用结果。这就是理解 Jev 出现背景的关键。
        - heading "三、有了 Jev，变化在哪里？" [level=3] [ref=e62]
