              - generic [ref=e119]: 达到门槛：进入处理流程不确定：澄清或复核
          - paragraph [ref=e120]: 这是处理流程示意，不是模型实测结果。接收判断的可以是脚本、后台服务、工作流，也可以是 Agent。
        - heading "四、它解决了什么，又留下哪些工作？" [level=3] [ref=e121]
        - paragraph [ref=e122]: Jev 为常见语义判断提供了专门的接口和统一的结果形式，让开发者更容易把判断接入分流、排序和信息检查。它可以独立使用，Agent 只是可选的调用方。
        - paragraph [ref=e123]: 通用大模型同样可以完成这类任务并返回结构化数据。Jev 是否适合你的场景，需要比较实际判断质量、延迟和成本；问题定义、样本验证、阈值选择、权限检查和失败处理仍由应用负责。
