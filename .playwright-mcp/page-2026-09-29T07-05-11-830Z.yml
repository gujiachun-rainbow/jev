        - heading "四、它解决了什么，又留下哪些工作？" [level=3] [ref=f1e122]
        - paragraph [ref=f1e123]: Jev 为常见语义判断提供了专门的接口和统一的结果形式，让开发者更容易把判断接入分流、排序和信息检查。它可以独立使用，Agent 只是可选的调用方。
        - paragraph [ref=f1e124]: 通用大模型同样可以完成这类任务并返回结构化数据。Jev 是否适合你的场景，需要比较实际判断质量、延迟和成本；问题定义、样本验证、阈值选择、权限检查和失败处理仍由应用负责。
        - paragraph [ref=f1e125]:
          - text: 模型定位与返回类型依据：
          - link "Jev 官方介绍" [ref=f1e126] [cursor=pointer]:
            - /url: https://docs.typesafe.ai/introduction
          - text: 。以上对比用于说明设计动机，不代表各方案的性能评测。
