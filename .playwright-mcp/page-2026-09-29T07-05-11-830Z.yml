      - generic [ref=f1e46]:
        - generic [ref=f1e47]: 课程背景
        - heading "序章 为什么有 Jev" [level=2] [ref=f1e49]
        - generic [ref=f1e50]: 理解语义判断的常见做法、接入难点，以及 Jev 带来的变化。
        - paragraph [ref=f1e51]: 假设你正在开发客服系统或商品推荐功能。用户用日常语言表达需求，程序却需要一个明确的判断结果，才能决定下一步做什么。下面用两个具体场景说明。
        - paragraph [ref=f1e52]:
          - strong [ref=f1e53]: 场景一：客服消息应该交给谁？
          - text: 一家电商平台由物流客服处理配送查询，售后客服处理退款申请。客户说“订单还没收到，帮我查查到哪了”，需要物流客服帮忙查询；如果说“订单还没收到，我不想等了，想申请退款”，则需要售后客服处理。两句话都有“订单还没收到”，但客户想办的事不同。客服系统需要理解客户是在查进度还是申请退款，才能把消息交给合适的人。
        - paragraph [ref=f1e54]:
          - strong [ref=f1e55]: 场景二：两台预算内的电脑，哪台更适合？
          - text: 用户说“预算 6000 元，经常出差，主要写文档、开视频会议，希望轻便，不玩游戏”。商店里有一台 4999 元、重 1.2 kg 的办公本，以及一台 5999 元、重 2.5 kg 的游戏本。两台都在预算内，也都能满足基本办公需求，但用户经常需要带着电脑出差，较轻的办公本更符合他的需求。推荐系统需要结合用户的用途和偏好，判断哪台更适合他。
        - paragraph [ref=f1e56]:
          - text: 这两个场景有一个共同点：
          - strong [ref=f1e57]: 需要理解用户话里的意思，才能做出业务判断
          - text: 。前者要判断客户想办理哪类业务，后者要判断商品与用户需求有多匹配。这正是 Jev 所关注的语义判断需求。
        - heading "一、没有 Jev 时，这类问题怎么解决？" [level=3] [ref=f1e58]
        - paragraph [ref=f1e59]: 语义判断早已有多种实现方式。选择哪一种，取决于任务范围、数据和维护成本。
        - generic [ref=f1e60]:
          - generic [ref=f1e61]:
            - text: 01 / 规则与关键词
            - heading "把判断写成条件" [level=4] [ref=f1e62]
            - paragraph [ref=f1e63]: 例如看到“物流”就分到物流队列。规则明确、容易追踪，但“怎么还没送到”和“已经收到了，不用查物流”需要理解不同含义；只靠关键词时，往往要不断补充例外。
          - generic [ref=f1e64]:
            - text: 02 / 专用分类模型
            - heading "为特定任务训练模型" [level=4] [ref=f1e65]
            - paragraph [ref=f1e66]: 用标注样本训练分类器或评分模型，可以直接输出判断。代价是准备数据、训练与维护；新增类别或改变标准时，还要评估是否需要重新训练。
          - generic [ref=f1e67]:
            - text: 03 / 通用大模型
            - heading "在提示词里定义判断任务" [level=4] [ref=f1e68]
            - paragraph [ref=f1e69]: 在提示词中说明类别或评分标准，让模型理解用户需求并返回判断。接入灵活，但仍需约定输出格式、验证判断质量，并处理信息不足和误判。
        - generic [ref=f1e70]:
          - heading "展开看：通用大模型如何完成判断" [level=4] [ref=f1e71]
          - generic [ref=f1e72]:
            - heading "怎么处理？" [level=5] [ref=f1e73]
            - paragraph [ref=f1e74]: 把用户原话和判断要求一起交给模型。例如告诉它：“查询配送进度属于物流，申请退款属于售后；请判断这条消息的类别，信息不足时返回无法确定。”对于推荐，则提供用户需求和商品资料，要求它按办公、便携等标准给每件商品打分。
          - generic [ref=f1e75]:
            - heading "怎么接入程序？" [level=5] [ref=f1e76]
            - paragraph [ref=f1e77]: 约定输出字段，例如客服返回“类别”，推荐返回“商品编号、匹配分数”。模型按要求生成文本或 JSON，程序读取结果后分流或排序。支持结构化输出的模型还可以约束字段类型和类别范围，便于程序读取。
          - generic [ref=f1e78]:
            - heading "局限在哪里？" [level=5] [ref=f1e79]
            - paragraph [ref=f1e80]: 格式正确不代表判断正确：“查物流，也想问问退款”同时包含两种诉求，需要先规定如何处理；“打 8 分”也需要明确评分尺度，才能与其他商品比较。模型自己写出的“90% 把握”不能直接当成经过校准的正确率。开发者仍需设计判断标准、用真实样本检验效果，并处理误判和信息不足；提示词或模型版本变化后，也需要重新验证。
        - heading "二、接入难点：拿到答案后，程序凭什么继续？" [level=3] [ref=f1e81]
        - generic [ref=f1e82]: “这大概是物流问题，建议查询订单。”
        - paragraph [ref=f1e83]: 人能理解这句话，但程序还需要明确的约定：类别字段是什么？“大概”怎么影响分流？信息不足时，是直接查询还是先追问？即使返回合法 JSON，也只解决了结果格式的一部分问题，不能证明语义判断正确，更不能自动确定业务动作。
        - paragraph [ref=f1e84]: 分类、评分和条件检查会在不同业务里反复出现。与其每次重新约定一套回答方式，可以把它们设计成统一的判断接口：明确问什么、返回什么，再由代码决定如何使用结果。这就是理解 Jev 出现背景的关键。
        - heading "三、有了 Jev，变化在哪里？" [level=3] [ref=f1e85]
        - table [ref=f1e87]:
          - rowgroup [ref=f1e88]:
            - row [ref=f1e89]:
              - columnheader "开发者要解决的问题" [ref=f1e90]
              - columnheader "Jev 提供的方式" [ref=f1e91]
              - columnheader "业务代码如何使用" [ref=f1e92]
          - rowgroup [ref=f1e93]:
            - row [ref=f1e94]:
              - cell "这条消息属于哪一类？" [ref=f1e95]
              - cell "Choice：返回类别、概率分布与置信度" [ref=f1e96]
              - cell "分到对应队列；低置信度时先澄清" [ref=f1e97]
            - row [ref=f1e98]:
              - cell "这个候选有多合适？" [ref=f1e99]
              - cell "Score：依据有序标准返回分数、概率分布与置信度" [ref=f1e100]
              - cell "排序、过滤，或决定是否需要复核" [ref=f1e101]
            - row [ref=f1e102]:
              - cell "用户是否提供了必要信息？" [ref=f1e103]
              - cell "Noul：返回条件成立的概率" [ref=f1e104]
              - cell "按门槛判断是否继续收集信息" [ref=f1e105]
        - paragraph [ref=f1e106]: 开发者仍然需要定义问题和标准，但返回值的类型与读取方式由接口约定。模型负责给出判断，代码显式处理阈值、兜底和后续动作；调整业务策略时，可以修改代码中的规则。
        - generic [ref=f1e107]:
          - generic [ref=f1e108]: 以客服分流为例 / 从输入到动作
          - generic [ref=f1e109]:
            - generic [ref=f1e110]:
              - strong [ref=f1e111]: 提交消息与问题
