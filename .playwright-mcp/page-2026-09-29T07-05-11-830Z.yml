          - code [ref=f1e198]: team
          - text: 的答案在
          - code [ref=f1e199]: result.choices["team"]
          - text: 。键名本身不承担问题说明；实际判定内容写在
          - code [ref=f1e200]: instructions
          - text: 和
          - code [ref=f1e201]: criteria
          - text: 中。你也可以运行
